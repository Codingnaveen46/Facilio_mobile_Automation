version: '3'

services:
  # Android Emulator Service (using budtmo/docker-android)
  appium:
    image: budtmo/docker-android:emulator_11.0
    privileged: true
    restart: unless-stopped
    ports:
      - "4723:4723" # Appium port
      - "6080:6080" # Web UI for emulator (noVNC)
    environment:
      - DEVICE=Samsung Galaxy S10
      - APPIUM=true
      - EMULATOR_ARGS=-no-audio -no-boot-anim -gpu swiftshader_indirect
    volumes:
      - ./apps:/root/tmp/apps # Mount local 'apps' folder to container

  # Test Runner Service
  test-runner:
    build: .
    depends_on:
      - appium
    environment:
      - APPIUM_HOST=appium
      - APPIUM_PORT=4723
      - APPIUM_PATH=/
      - TAG_EXPRESSION # Pass-through from host environment
      - DEVICE_NAME=Samsung Galaxy S10
      - PLATFORM_VERSION=11
    volumes:
      - ./allure-results:/app/allure-results
      - ./reports:/app/reports
    # Command to run tests - waits for services to settle or just runs
    command: npm run android
